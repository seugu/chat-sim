[workspace]
resolver = "3"

members = [
    "crates/harness",
    "crates/network-model",
]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# logos-chat a74ad35 with the SDS delivery fix (seugu/logos-chat sds-reliability-fixes-a74ad35).
components = { git = "https://github.com/seugu/logos-chat", rev = "05276814577732b06a0e0fc9c5234a77667aae6f" }
crypto = { git = "https://github.com/seugu/logos-chat", rev = "05276814577732b06a0e0fc9c5234a77667aae6f" }
libchat = { git = "https://github.com/seugu/logos-chat", rev = "05276814577732b06a0e0fc9c5234a77667aae6f" }

# Spelled as logos-chat spells them: cargo tells git sources apart by their URL and rev as written,
# and a second spelling would link a second de-mls whose types are not libchat's.
chat-proto = { git = "https://github.com/logos-messaging/chat_proto", rev = "948f4ad6dedb01b44e279204d8eb30a1eda5a330" }
de-mls = { git = "https://github.com/vacp2p/de-mls", rev = "4d85a02" }

network-model = { path = "crates/network-model" }

[profile.release]
panic = "abort"
